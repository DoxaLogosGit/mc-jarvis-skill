name: release

# A release is cut by pushing a tag, so the version that ships is the one
# written down in git rather than one typed into a form at the time.
on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job below may write.
permissions:
  contents: read

jobs:
  # The same checks a push to main runs, called rather than copied: a
  # second copy would drift from the first, and the release is the one
  # build where that matters most. `distribution-rule` is the reason -
  # the repository ships code and configuration only, and a release is
  # the artifact people keep.
  checks:
    # zizmor suggests a newer self-repository syntax for this line. Kept as
    # is: the release workflow is the last place to adopt syntax nobody
    # here has seen work.
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # The only write this workflow needs. `gh release create` uses the
      # built-in token, so there is no third-party action holding a
      # credential and nothing to rotate.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout pushes, so the token is not left on
          # disk for a later step - or a test - to find.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # A release builds from nothing. uv's cache is shared with the
          # pull-request runs, and an artifact people install must not
          # depend on anything one of those could have left in it.
          enable-cache: false

      - name: The tag and the version must agree
        # Without this, `git tag v0.3.0` on a tree that still says 0.2.0
        # publishes a release page headed 0.3.0 whose wheel installs as
        # 0.2.0. Nothing downstream would notice, and the wheel is the
        # half that wins.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          if [ "$tag" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${have}."
            echo "Bump the version and re-tag, or tag v${have}."
            exit 1
          fi
          echo "version=$have" >> "$GITHUB_ENV"

      - name: Build the wheel and the sdist
        run: uv build

      - name: Archive the skill folder, tool included
        # A skill folder that holds its own scripts, which is how skills
        # shipping code are normally laid out: unzip it into a skills
        # directory and `scripts/mc-jarvis` runs from there. The wheel
        # remains for people who would rather install a package.
        run: |
          uv run python tools/build_skill_bundle.py bundle
          ( cd bundle && zip -qr "../dist/mc-jarvis-skill-${version}.zip" mc-jarvis )
          unzip -l "dist/mc-jarvis-skill-${version}.zip" | tail -3

      - name: Checksums
        # Over the artifacts only, and written last, so the file does not
        # try to cover itself.
        run: |
          cd dist
          sha256sum mc_jarvis-*.whl mc_jarvis-*.tar.gz \
            "mc-jarvis-skill-${version}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to the releases page
        env:
          GH_TOKEN: ${{ github.token }}
        # A release candidate is marked a prerelease, so it never becomes
        # the "latest" release the README sends new readers to.
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *rc*|*a[0-9]*|*b[0-9]*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $pre \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/mc_jarvis-*.whl \
            dist/mc_jarvis-*.tar.gz \
            "dist/mc-jarvis-skill-${version}.zip" \
            dist/SHA256SUMS
