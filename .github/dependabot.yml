# Dependabot keeps the pinned actions and the Python dependencies current.
# Actions are pinned to commits (see the workflows), so without this they
# would never move; it rewrites the commit and the version comment beside
# it together. Grouped so each week is one pull request per kind.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
