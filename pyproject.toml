[project]
name = "mc-jarvis"
version = "0.1.0"
description = "An agent-agnostic assistant for Marvel Champions: The Card Game"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0", "PyYAML>=6.0"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
mc-jarvis = "mc_jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_jarvis"]

# The skill and config ship inside the wheel so `uv tool install` users,
# who have no checkout, can still run `install-skill` (spec §7). In a
# checkout these paths are symlinks to the repo-root sources; force-include
# resolves them to real files at build time.
[tool.hatch.build.targets.wheel.force-include]
"config/legality.yaml" = "src/mc_jarvis/_bundled/legality.yaml"
"config/glyphs.yaml"   = "src/mc_jarvis/_bundled/glyphs.yaml"
"config/timing.yaml"   = "src/mc_jarvis/_bundled/timing.yaml"
"config/encounter_setup.yaml" = "src/mc_jarvis/_bundled/encounter_setup.yaml"
"config/keywords.yaml" = "src/mc_jarvis/_bundled/keywords.yaml"
"skill"                = "src/mc_jarvis/_bundled/skill"

# The source distribution needs an explicit list. Hatchling's default is
# everything git tracks, which shipped 28 test files and the design docs -
# and those are the two places this project's distribution rule is
# knowingly relaxed. Test fixtures carry real card text because a parser
# test with invented input tests nothing, and the specs quote Contents
# blocks as evidence. Neither belongs in a package someone installs.
#
# `uv build` builds the WHEEL FROM THE SDIST, so this list must still
# carry everything the wheel's force-include needs: config/ and skill/.
# `tests/test_packaging.py` builds both and checks them.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/skill",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a built index; skipped when absent"]
