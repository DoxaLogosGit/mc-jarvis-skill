# Trigger timing and priority. Added 2026-08-21, corrected against real
# data 2026-08-22.
#
# The ordering itself is NOT here. It is the RR's own "Simultaneous Timing
# Priority" chart, parsed from the ABILITY entry at build time by
# `timing.parse_chart`. This file holds only what the chart does not say:
# which printed card prefixes map onto which rung, and the qualifier and
# alias rules.
#
# `expected_chart` is what the chart said on 2026-08-21. It is compared
# against the parsed chart at build time, so a revision upstream is
# reported rather than silently changing every answer.
#
# NO PAGE NUMBERS LIVE IN THIS FILE. Pages are read from `rules_entries`
# at query time, so a citation cannot drift from `rules show <term>`.
# (The 2026-08-21 draft hard-coded Ability p.5 and First Player p.20; the
# indexed RR says p.4 and p.19. Reading the page kills that whole class.)

version: 2

chart_source:
  rr_entry: Ability

# What the chart looked like on 2026-08-21, recorded so a revision
# upstream is reported rather than silently changing every answer.
#
# NO RULEBOOK TEXT LIVES HERE. `shape` is rung numbers and tier letters -
# structure, not anything FFG wrote - and `text_digest` fingerprints the
# wording. Together they catch a re-lettered tier by name and a rewording
# by digest, without this repository carrying the rulebook.
expected_chart:
  shape: [[1, null], [2, null], [2, "a"], [2, "b"], [2, "c"],
          [3, null], [4, null], [4, "a"], [4, "b"], [5, null]]
  text_digest: "968770fd0ac6809570c804030673435a"

# Rules Reference entries this mapping depends on, fingerprinted as of
# Rules Reference 1.8. `verify_citations` re-checks each at build time, so
# a reworded entry names itself instead of leaving the mapping quietly
# wrong. A digest is stronger than the quotation it replaced: a quote only
# catches a rewording of the sentence quoted.
entry_digests:
  "Ability":                    "7b836a7ad4189ed2ba89a508d166bce6"
  "Forced":                     "910c669f0f2815ddd937f2013352a0ac"
  "First Player":               "388765fa32ae24c55fb7c8895b5e87b6"
  "Interrupt":                  "e6c0eb8cafbcf77ca6d9a5744520d98c"
  "Response":                   "a6a743252ac5868fc2ca18f65e19ec7e"
  "Simultaneous Resolution":    "cf5ef006ce05be113006b63d9026ab42"
  "Status Cards":               "0eabd7a1ffe192344680f4013707fb1c"
  "Resource Ability":           "2d388d65cde473e878c6401b8761cbe4"
  "Special":                    "0a55c6090d1dd240fe0edc94312bfff2"
  "Setup (Triggered Ability)":  "bb91192720be6bb0457a0e5fddd48cf6"
  "When Defeated Abilities":    "8200b4e1f7f49993e09bd6defacf0163"
  "When Completed Abilities":   "06c49358c0ebd26ca4441e06bbeca955"

# Bold prefixes that qualify a trigger without being one. The printed
# prefix is `<qualifier> <trigger>`, e.g. "Hero Action". Matched
# case-insensitively: 2 cards print "Alter-ego Action" with a lower-case
# second word (27131 Common Criminal, 25034 Leadership Training).
#
# A PARENTHETICAL qualifier is NOT restricted to this list. If the text
# outside the parens resolves to a trigger, the parenthetical is recorded
# verbatim - that is what makes "When Revealed (Norman Osborn)" (2 cards)
# and the mis-set "When Revealed (Alter_Ego)" (32070) classify without a
# name list to maintain.
qualifiers: ["Hero", "Alter-Ego", "First Player", "Mission"]

# Printed prefix -> the chart rung it occupies.
# `sub` picks the lettered tier where the chart has one.
triggers:
  Forced Interrupt: {rung: 2, sub: "b"}
  Interrupt:        {rung: 2, sub: "c"}
  Boost:            {rung: 3, sub: null}
  When Revealed:    {rung: 3, sub: null}
  Forced Response:  {rung: 4, sub: "a"}
  Response:         {rung: 4, sub: "b"}

# Aliases the RR defines as equivalent to another trigger.
# NOTE: "When Revealed" is deliberately NOT here. The RR states this
# equivalence for When Defeated and When Completed only; the chart puts
# When Revealed on rung 3, a full tier after Forced Interrupts.
aliases:
  When Defeated:
    canonical: Forced Interrupt
    rr_entry: When Defeated Abilities
  When Completed:
    canonical: Forced Interrupt
    rr_entry: When Completed Abilities

# Triggers with no rung: they are not tied to a triggering condition, so
# the chart does not order them. `Forced` is handled as a modifier rather
# than a prefix of its own, which is what lets "Forced Action" (11 cards)
# classify as Action with forced = true.
outside_chart:
  Action:   {rr_entry: Forced}
  Resource: {rr_entry: Resource Ability}
  Special:  {rr_entry: Special}
  Setup:    {rr_entry: Setup (Triggered Ability)}

# A quoted timing trigger is a REFERENCE to abilities with that trigger,
# not a trigger. Cited, not guessed - the rule sits in the same entry the
# chart comes from.
quoted_reference:
  rr_entry: Ability

# Misprints in the published card text. Each names the card it appears on
# so the mapping stays auditable; a fuzzy matcher would not be. Applied
# after the qualifier and parenthetical are stripped.
#
# Not listed here, because they resolve without help:
#   "Alter-ego Action"          - qualifiers match case-insensitively
#   "When Revealed (Alter_Ego)" - parentheticals are taken verbatim
misprints:
  Reponse:
    correct: Response
    seen_on: ["32187", "32191"]     # Surprise!
  Reveled:
    correct: Revealed
    seen_on: ["04150"]              # Weapon Master

# One printed prefix, two triggers. The card has both abilities, so it
# gets a row for each - which is why `classify_all` exists alongside
# `classify`. Listed explicitly rather than split on "/" by rule: the
# convention that "When Revealed/Defeated" abbreviates "When Defeated"
# is an inference, and one card is not enough evidence for a rule.
compounds:
  "When Revealed/Defeated":
    parts: ["When Revealed", "When Defeated"]
    seen_on: ["59042"]            # Hecate
  # 21147 Hela's Crown prints `<b>Forced Response<b>:` - an opening tag
  # where a closing one belongs. The bold span therefore runs to the next
  # `</b>`, swallowing the ability text AND the card's Boost trigger. The
  # only malformed bold span in the corpus, so it is corrected by name
  # rather than by a rule about colons inside bold text.
  "Forced Response: After Hela schemes, give her a facedown boost card. [star] Boost":
    parts: ["Forced Response", "Boost"]
    seen_on: ["21147"]            # Hela's Crown

# A bold span longer than this is prose bolded for emphasis on a villain
# or scheme card ("If Odin leaves play, the players lose the game."), not
# a timing trigger. Measured 2026-08-22 across all 4,379 cards: the
# longest span that classifies is 29 characters ("When Revealed (Norman
# Osborn)") and the shortest bolded sentence is 41 ("Threat cannot be
# removed from Gjallerbru."), so the cutoff sits in an 11-character empty
# band rather than on top of anything. `compounds` keys are exempt.
# `test_the_prefix_cutoff_sits_in_measured_empty_space` re-measures.
max_prefix_chars: 40

# Bold text that is not a triggered ability at all.
# `Boost` is NOT in this list - the chart makes it rung 3.
not_triggers:
  - Contents
  - Scenario Contents
  - Preparation
  - Standard Mode Only.
  - Expert Mode Only.
  - Elite                       # 04143 Hydra Reinforcements
  - TRAITS                      # 36005 Blizzard
  - bold                        # 27153 Induced Panic
  - the players win the game    # 50103a/b M.O.D.O.K.

# Shapes that are not triggers. A pattern is allowed here only when it
# matches no trigger this reference currently knows, and none of the
# prefixes that actually classify in the real corpus - the two tests named
# `..._not_trigger_pattern` assert both. That is what separates a named
# rule from the wildcard the plan forbids. It cannot speak for a trigger
# FFG has not printed yet; the corpus check is what would catch one.
not_trigger_patterns:
  # "Give to the Tony Stark player." and ~45 siblings, including the four
  # printed without "the" or without the full stop, and two that print
  # "Player" capitalised.
  - "^Give to (the )?.+? [Pp]layer\\.?$"
  # "Wrecker's Side Scheme.", "Proxima Midnight's Scheme.", ...
  - "^.+?'s (Side )?Scheme\\.$"

# Refinements the chart does not carry, each cited. Pages come from the
# index at print time.
tie_breaks:
  - rule: >-
      The first player has the first opportunity at each rung; opportunities
      then proceed in player order.
    rr_entry: First Player
  - rule: >-
      If two or more forced abilities would initiate at the same moment,
      the first player chooses the order - regardless of who controls them.
    rr_entry: Forced
  - rule: >-
      Each forced ability resolves as completely as possible before the
      next forced ability on the same triggering condition initiates.
    rr_entry: Forced
  - rule: >-
      If two effects with the same bold trigger would resolve
      simultaneously, the first player chooses the order.
    rr_entry: Simultaneous Resolution
  - rule: >-
      An interrupt using the word "would" resolves before its triggering
      condition initiates, ahead of other interrupts to that condition.
    rr_entry: Interrupt
  - rule: >-
      One effect causing several triggering conditions lets responses to
      each be resolved in any order.
    rr_entry: Response
  - rule: >-
      Status card abilities take timing priority over any conflicting
      triggered ability - which is why the chart puts them at rung 2a.
    rr_entry: Status Cards
