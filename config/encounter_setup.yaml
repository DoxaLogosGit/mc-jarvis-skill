# Cards a scenario removes from its encounter deck at setup, where the
# card data does not say so on its own.
#
# Most set-aside cards ARE named, by other cards, using the hyphenated
# adjective: "a random set-aside [[Prelate]] minion".
# `encounterdeck.set_aside_groups` reads those, and each scenario's main
# scheme `Setup` block names them independently. Two unrelated places in
# the data, so `audit` cross-checks them rather than trusting either.
#
# This file holds only what NEITHER source names. Every entry carries the
# `Setup` sentence that justifies it as a digest, re-verified at build
# time, so a reworded scheme fails the build instead of leaving a stale
# acknowledgment in force.
#
# NO CARD TEXT LIVES HERE, per the repository's distribution rule. The
# `reason` field is a maintainer's own words; `setup_digest` fingerprints
# the sentence those words describe.

version: 1

# villain_set -> why its Setup block flags cards the text rule cannot find.
#
# 33 of 56 villain sets carry a Setup block that removes cards from the
# encounter deck. The text rule covers most of them. Anything left is a
# decision, and belongs here with a reason.
acknowledged:
  absorbing_man:
    reason: >-
      An environment is discarded from the deck at random and put into
      play; the discard pile is shuffled back. One environment leaves
      the deck and which one is not determinable.
    affects_deck: true
    setup_digest: "fe5550266a3ce5d3de49fa56cfa1c6bd"

  baron_zemo:
    reason: >-
      Every [[Board Member]] environment starts in play. Named by
      trait, which the into-play rule reads only by card name.
    affects_deck: true
    setup_digest: "eefdc993b3c141bd9be92b9e6e683707"

  brotherhood_of_badoon:
    reason: >-
      Two cards start in play, named in one clause with two different
      type words. The rule reads one type word per clause.
    affects_deck: true
    setup_digest: "f244274b62d6d207f68cb61897168c56"

  dark_beast:
    reason: >-
      Three whole encounter sets are set aside. A set-selection
      question rather than a per-card role; see scenario assembly.
    affects_deck: false
    setup_digest: "60a834047b0349f1d87b00d4ddf8e4a9"

  enchantress_villain:
    reason: >-
      One Hypnotic Gaze attaches to each identity and the rest are set
      aside, so none remains in the deck. Uses the verb form of 'set
      aside', not the hyphenated adjective the text rule reads.
    affects_deck: true
    setup_digest: "22442b9ac5b0a464c610cc0282aeb3b8"

  hela:
    reason: >-
      Two cards are revealed and four more set aside by bare name,
      with no type word for the rule to anchor on.
    affects_deck: true
    setup_digest: "bb5dc3617df860d7e5b4f9630d763835"

  juggernaut:
    reason: >-
      An attachment is attached at setup and leaves the deck. The
      other named card is an ally, never an encounter-deck card, and
      is misspelled upstream.
    affects_deck: true
    setup_digest: "e6042e5946f07c93e7c94a0ed34d9ac7"

  kang:
    reason: >-
      Villain stages and a side scheme are set aside by bare name, and
      each player's obligations leave the game.
    affects_deck: true
    setup_digest: "8a7ec2866e58cca26ae9b6be550c538f"

  magog:
    reason: >-
      Two environments start in play, written as 'environment card'
      rather than the bare type word.
    affects_deck: true
    setup_digest: "25f742fb85fd2abef34c4a8cc21bcc45"

  master_mold:
    reason: >-
      An ally starts in play under a player's control. Allies are
      never encounter-deck cards, so the deck is unchanged.
    affects_deck: false
    setup_digest: "4fc4dd73202e15fcebc52d2e8eaf418d"

  mister_sinister:
    reason: >-
      Three whole encounter sets are set aside. A set-selection
      question rather than a per-card role.
    affects_deck: false
    setup_digest: "be7a62d7bbc46f11c17edbae291db790"

  mysterio:
    reason: >-
      A minion is put into play per player, so the number leaving the
      deck scales with player count.
    affects_deck: true
    setup_digest: "7be1c9596beef1213b32a00cf2e64f37"

  nebula:
    reason: >-
      Two cards start in play in a two-type clause, and further cards
      are attached from the top of the deck per player.
    affects_deck: true
    setup_digest: "c3cb40e6a7ee06b9128b724de6d7dca4"

  on_the_run:
    reason: >-
      One random [[MARAUDER]] villain is chosen and the minion sharing
      its title leaves the game. Which minion depends on the villain
      drawn.
    affects_deck: true
    setup_digest: "8e4e463b72f401e6995b67b728280f99"

  red_skull:
    reason: >-
      Every side scheme but one moves to a separate side-scheme deck
      beside the encounter deck, and one minion is set aside.
    affects_deck: true
    setup_digest: "ac0161d5967234965200197147b1d15e"

  ronan:
    reason: >-
      Two cards start in play in a two-type clause, plus two
      attachments placed at setup.
    affects_deck: true
    setup_digest: "6aa26adc53d020e49fb68e44f1b5eb89"

  sandman:
    reason: >-
      An environment is searched out of the deck and put into play,
      phrased as 'search ... and put it into play'.
    affects_deck: true
    setup_digest: "f770df6996b216ef97e6ea46afb326c4"

  spiral:
    reason: >-
      A side scheme and one random [[SHOW]] environment start in play;
      the remaining [[SHOW]] environments form a separate deck.
    affects_deck: true
    setup_digest: "5b4bac098754159f3fa04a78c21b393f"

  stryfe:
    reason: >-
      A side scheme is revealed at setup and leaves the deck. The
      other named card is an ally.
    affects_deck: true
    setup_digest: "184f1c77bd5293ad1e1d336ad34b559a"

  the_hood:
    reason: >-
      Seven modular sets are set aside and one shuffled in, with more
      added during play. A growing deck rather than a set-aside list.
    affects_deck: false
    setup_digest: "7d768e66b95917672829ac3e8d8b15b0"

  tower_defense:
    reason: >-
      A second main scheme stage is put into play, referred to by
      pronoun. Main schemes are never encounter-deck cards.
    affects_deck: false
    setup_digest: "ab89daa5dfb2b03fd4a60dcb1134219c"

# Groups the set-aside rule extracts but that resolve to no card - an
# upstream typo, or a phrasing the pattern was not built for. Empty is the
# goal; a non-empty entry is a parser gap, not a data gap.
unresolved: {}

# --- scenario -> modular mapping (§14.1) -----------------------------
#
# The mapping itself is NOT here. It is read from each scenario's own main
# scheme Contents block, because FFG prints it there and marvelsdb carries
# the text verbatim - 49 of 56 villain sets. This section holds only what
# the parse cannot resolve.

# Upstream spellings that do not match `sets.name`.
modular_aliases:
  # FFG's own typo, on the Batroc main scheme.
  "Batrocs's Brigade": "Batroc's Brigade"
  # The set name carries the final stop.
  "S.H.I.E.L.D": "S.H.I.E.L.D."

# Villain sets whose main scheme carries no Contents block at all. Each
# needs its modulars from the printed insert, or an explicit statement
# that it prescribes none - `assess` must not silently assess them
# against nothing.
no_contents_block: {}

# --- back faces the data does not link (§14.11) -----------------------
#
# A double-sided card is two rows in marvelsdb, and counting both doubles
# it. The rule is `back_link`: a row named as some card's back face is not
# a separate card. That covers 66 of the 70 deck-role rows whose code is
# `X+b` beside an `X+a` sibling.
#
# The other 4 were read one at a time. Three are genuinely two cards that
# share a code stem - the set ships both. One is an upstream break.
back_faces:
  # Front is 45104a "Heart of the Empire", whose `back_link` points at
  # 45105b instead of at this card. One physical side scheme, two rows.
  "45104b": "its front's back_link is wrong upstream"

# Rows the suffix pattern flags that are NOT back faces: separate physical
# cards printed with an a/b code stem. Listed so `back_face_gate` can tell
# a decided case from an unexamined one.
not_back_faces:
  "01144b": "Ultron ships two Android Efficiency; identical text, both real"
  "50184b": "the [mental] A.I.M. Interference, beside the [energy] one"
  "61033b": "the [mental] Suggestion, beside the [energy] one"

# --- scenarios whose deck grows during play (§14.9) -------------------
#
# The pool is NOT parsed. Six cases exist corpus-wide and each is phrased
# differently, so a parser would be six special cases wearing one regex.
# Each entry instead carries the set codes and the digest of the sentence
# that puts them there, re-verified at build time, so a reworded card
# fails the build rather than leaving a stale pool in force.
#
# `mechanism` is load-bearing. A `random` pool makes the grown deck a
# RANGE - the sets are drawn without replacement and differ in size - so
# a single mean would be a number that looks exact and is not (§14.9).
# A `deterministic` addition is exact at both ends.
growing:
  dark_beast:
    mechanism: random
    pool: [blue_moon, genosha, savage_land]
    # How many of the three actually arrive depends on which villain
    # stages a game passes through, which the card data does not settle.
    # Left unset, so the upper bound is the whole pool - true, if loose.
    reason: >-
      Three environment sets are set aside at setup; each villain stage
      reveals one at random and shuffles the rest of its set in.

  mojo:
    mechanism: random
    pool: [crime, fantasy, horror, longshot, sci-fi, sitcom, western]
    # The player pre-selects 1 + 1 per hero, so the count is a table
    # decision rather than a card fact. The pool bounds it at seven.
    reason: >-
      The player pre-selects 1 + 1 per hero from the MojoMania pack's
      seven modulars; the main scheme reveals one at random and shuffles
      the remainder in. The pool is the pack, so it is knowable even
      though the selection is not.

  the_hood:
    mechanism: player_chosen
    pool: []
    reason: >-
      Seven modular sets chosen from the whole collection, one shuffled
      in at random per reveal. Nothing in the data can infer them, so
      `assess` requires --modular rather than assessing against nothing.

  mister_sinister:
    mechanism: random
    pool: [flight, super_strength, telepathy]
    # Stage 1B removes one stage 2 at random and the other two are both
    # played, so exactly two of the three sets ever arrive.
    max_draws: 2
    reason: >-
      Flight, Super Strength and Telepathy are set aside at setup. Each
      stage 2 attaches one set's attachment and shuffles the rest of that
      set in. Missed by the spec's hand list of three; the growth gate
      found it.

  escape_the_museum:
    mechanism: deterministic
    pool: [ship_command]
    max_draws: 1
    reason: >-
      The Ship Command set is set aside at setup, its Milano support
      enters play at stage 2, and the remainder is shuffled in at stage
      3. Certain, not random - both ends are exact.

# Growth that is NOT a random pool. Recorded so the gate cannot call
# these scenarios fixed-deck, and so a reader knows they were examined.
adds_during_play:
  dreadpool:
    mechanism: deterministic
    # Surfaced in `assess` output, not just here: a comment in a config
    # file is invisible to someone reading a deck size on their terminal.
    overstates_opening_deck: 5
    reason: >-
      A modular set, not a scenario. Its `Crisis of Infinite Deadpools`
      treachery starts in the deck and the set's other five cards are set
      aside until it is revealed. Part 1 counts all six in the opening
      deck, which OVERSTATES it by five copies for any scenario that
      includes this modular. The audit only reads villain-set main
      schemes, so intra-modular set-asides are not yet classified.

  morlock_siege:
    mechanism: deterministic
    reason: >-
      One treachery, Hide!, is shuffled in when main scheme stage 2 is
      revealed. A single card, exact at both ends.

  thunderbolts:
    mechanism: setup
    reason: >-
      Not growth. The chosen modular sets are shuffled in AT SETUP, minus
      their Elite minions, so they are already in the opening deck. Named
      here only so the growth gate does not report it as unexamined.
