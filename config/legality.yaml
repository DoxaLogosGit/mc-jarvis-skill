# Hand-encoded deckbuilding rules (spec §10).
#
# THIS PLAN populates only `out_of_deck`. Deck size, aspect purity, the
# dual-aspect exception, basic allowances and the Deadpool `pool` case are
# added in the deck-pipeline plan.
#
# Every entry under `exceptions` exists because no structured field marks
# the card. The setup audit fails the build when an identity implies a
# set-aside card that neither `permanent`, `hero_special`, nor this list
# covers - so this file cannot silently fall behind a new release.

version: 1

out_of_deck:
  # Structured mechanisms. Code reads the data, not these values; they are
  # named here so the config documents all three in one place.
  by_keyword: permanent            # spec §10 mechanism 1
  by_set_type: hero_special        # spec §10 mechanism 2

  # Mechanism 3: unmarked. Prose on the identity card is the only evidence.
  # `identity` is the identity_key, which is the set_code.
  exceptions:
    - identity: rogue
      cards: ["38002"]             # Touched
      note: >-
        Rogue's identity text instructs the player to find this card and set
        it aside. Verified 2026-08-22: deck_limit 1, quantity 1, permanent
        null, in the ordinary `rogue` set - structurally indistinguishable
        from a normal signature upgrade, and the set contains no permanent
        card that could stand in for it.
    - identity: valk
      cards: ["25002"]             # Death-Glow
      note: >-
        Brunnhilde's setup text names "Death Glow"; the card is named
        "Death-Glow". Resolution cannot be by exact name match, which is
        why the audit reports for review rather than resolving.
        NOTE the identity key is `valk`, not `valkyrie` - a wrong key here
        matches nothing and fails silently.

  # Identities the setup audit flags whose set-aside cards are already
  # handled by a structural mechanism. Listing them is not a formality:
  # coverage is an explicit human acknowledgment, because inferring it
  # from "this set contains some permanent card" would silently pass a
  # hero that has both a permanent card and an unmarked set-aside card.
  # Each `reason` is re-verified against the data at build time.
  acknowledged:
    - identity: iceman
      reason: hero_special
      note: Six Frostbite upgrades live in the `iceman_frostbite` set.
    - identity: storm
      reason: hero_special
      note: The `storm_weather_deck` set.
    - identity: doctor_strange
      reason: hero_special
      note: The `doctor_strange_invocation_deck` set.
    - identity: daredevil
      reason: hero_special
      note: The `daredevil_sense_deck` set, in pack `fne`.
    - identity: hercules
      reason: hero_special
      note: Both `hercules_labor_deck` and `hercules_gift_deck`.
    - identity: ironheart
      reason: identity_grouping
      note: >-
        "Set your other identities aside" refers to her other identity
        cards, which identity grouping already keeps out of the deck.

# Hero-specific deckbuilding overrides (spec §10 does not cover these).
#
# `deck_requirements` is null on every identity, so the ONLY evidence is
# prose on the alter-ego card. The scan in `deckrules.scan` finds which
# identities carry such text; this section says what each one means,
# because the semantics cannot be derived from the prose.
#
# `quote` must appear verbatim in the identity's card text. The audit
# re-checks it at build time, so a reworded card fails loudly rather than
# leaving a stale rule in force.
#
# Verified 2026-08-22: the scan returns exactly these seven identities.
deckbuilding_overrides:
  - identity: spider_woman
    aspects: 2
    equal_aspects: true
    quote: "Choose two aspects instead of one during deck-building"
    note: >-
      Must include an equal number of cards from the two chosen aspects.

  - identity: warlock
    aspects: 4
    equal_aspects: true
    max_copies_non_signature: 1
    quote: "your deck must include an equal number of cards from all 4 aspects"
    note: >-
      Also: "You cannot include more than 1 copy of any non-Adam Warlock
      card", which overrides deck_limit downward for every off-set card.

  - identity: cable
    off_aspect_allowance:
      type_code: player_side_scheme
      limit: null                    # null means no cap
    quote: "You may include player side schemes from any aspect in your deck"

  - identity: cyclops
    off_aspect_allowance:
      type_code: ally
      trait: X-MEN
      limit: null
    quote: "You may include [[X-MEN]] allies from any aspect in your deck"

  - identity: wonder_man
    off_aspect_allowance:
      type_code: event
      resource: energy
      limit: null
    quote: >-
      You may include events with a printed [energy] resource icon from
      any aspect in your deck

  - identity: gam
    off_aspect_allowance:
      type_code: event
      traits_any: ["attack", "thwart"]
      limit: 6
    quote: "You may include up to 6"
    note: >-
      Up to 6 attack and/or thwart events from aspects other than the
      chosen one. The cap is on the total, not per trait.

  - identity: maria_hill
    off_aspect_allowance:
      type_code: support
      trait: S.H.I.E.L.D.
      limit: 3
      limit_unit: distinct_titles
    quote: "You may include the maximum number of copies of 3"
    note: >-
      Three S.H.I.E.L.D. supports at their full copy count - the cap is on
      distinct titles, not on cards, so it is 3 titles x deck_limit each.
