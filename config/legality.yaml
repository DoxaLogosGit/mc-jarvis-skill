# Hand-encoded deckbuilding rules (spec §10).
#
# THIS PLAN populates only `out_of_deck`. Deck size, aspect purity, the
# dual-aspect exception, basic allowances and the Deadpool `pool` case are
# added in the deck-pipeline plan.
#
# Every entry under `exceptions` exists because no structured field marks
# the card. The setup audit fails the build when an identity implies a
# set-aside card that neither `permanent`, `hero_special`, nor this list
# covers - so this file cannot silently fall behind a new release.

version: 1

out_of_deck:
  # Structured mechanisms. Code reads the data, not these values; they are
  # named here so the config documents all three in one place.
  by_keyword: permanent            # spec §10 mechanism 1
  by_set_type: hero_special        # spec §10 mechanism 2

  # Mechanism 3: unmarked. Prose on the identity card is the only evidence.
  # `identity` is the identity_key, which is the set_code.
  exceptions:
    - identity: rogue
      cards: ["38002"]             # Touched
      note: >-
        Rogue's identity text instructs the player to find this card and set
        it aside. Verified 2026-08-22: deck_limit 1, quantity 1, permanent
        null, in the ordinary `rogue` set - structurally indistinguishable
        from a normal signature upgrade, and the set contains no permanent
        card that could stand in for it.
    - identity: valk
      cards: ["25002"]             # Death-Glow
      note: >-
        Brunnhilde's setup text names the card without its hyphen; the
        card itself carries one. Resolution cannot be by exact name match,
        which is why the audit reports for review rather than resolving.
        NOTE the identity key is `valk`, not `valkyrie` - a wrong key here
        matches nothing and fails silently.

  # Identities the setup audit flags whose set-aside cards are already
  # handled by a structural mechanism. Listing them is not a formality:
  # coverage is an explicit human acknowledgment, because inferring it
  # from "this set contains some permanent card" would silently pass a
  # hero that has both a permanent card and an unmarked set-aside card.
  # Each `reason` is re-verified against the data at build time.
  acknowledged:
    - identity: iceman
      reason: hero_special
      note: Six Frostbite upgrades live in the `iceman_frostbite` set.
    - identity: storm
      reason: hero_special
      note: The `storm_weather_deck` set.
    - identity: doctor_strange
      reason: hero_special
      note: The `doctor_strange_invocation_deck` set.
    - identity: daredevil
      reason: hero_special
      note: The `daredevil_sense_deck` set, in pack `fne`.
    - identity: hercules
      reason: hero_special
      note: Both `hercules_labor_deck` and `hercules_gift_deck`.
    - identity: ironheart
      reason: identity_grouping
      note: >-
        Her setup line about setting other identities aside refers to her
        other identity cards, which identity grouping already keeps out of
        the deck.

# Deckbuilding rules, from the Rules Reference. NUMBERS AND POINTERS ONLY:
# each value names the RR entry it came from, and the wording is read from
# `rules_entries` on the user's own machine at print time. The same rule
# `config/timing.yaml` follows, and CI rejects a pasted sentence.
deck_rules:
  minimum_size: 40
  rr_entry: Deck

  aspects:
    # One aspect unless the identity's own card says otherwise. Measured
    # across 124 published decks: 121 single-aspect, 3 with `aspect2`.
    default_max: 1
    rr_entry: Aspect
    # Factions a card may carry regardless of the chosen aspects.
    # `campaign` is here because campaign rewards are earned rather than
    # chosen (§10.2); they are noted, never judged.
    always_allowed: [basic, hero, campaign]

    # marvelcdb stores the declared aspect in `meta`, SEPARATELY from the
    # cards, so a player can rebuild a deck into another aspect and leave
    # the declaration behind. Judging purity against a stale declaration
    # rejects a legal deck and names the wrong cards.
    #
    # Measured over 1,478 decks: 1,325 have every non-signature aspect
    # card matching the declaration, and 15 have 10% or fewer. Between
    # those sits a gap - one deck at 30%, two at 40%. The 50-90% band is
    # mostly legal off-aspect allowances (Cyclops's X-MEN allies), which
    # is why it must NOT be swept up. The cut goes in the empty band.
    declaration_trusted_above: 0.2
    # Below this many aspect cards there is nothing to judge a
    # declaration against, so it is taken at face value.
    declaration_min_cards: 5

# Hero-specific deckbuilding overrides (spec §10 does not cover these).
#
# `deck_requirements` is null on every identity, so the ONLY evidence is
# prose on the alter-ego card. The scan in `deckrules.scan` finds which
# identities carry such text; this section says what each one means,
# because the semantics cannot be derived from the prose.
#
# `quote` must appear verbatim in the identity's card text. The audit
# re-checks it at build time, so a reworded card fails loudly rather than
# leaving a stale rule in force.
#
# Verified 2026-08-22: the scan returns exactly these seven identities.
# Heroes whose alter-ego card overrides the standard one-aspect rule.
#
# NO CARD TEXT LIVES HERE. `text_digest` fingerprints the identity's rules
# text as of 2026-08-25, and `deckrules.audit` re-checks it at build time,
# so a reworded card fails the build instead of leaving a stale rule in
# force. A digest is stronger than the quotation it replaced: a quote only
# catches a rewording of the sentence quoted.
deckbuilding_overrides:
  - identity: spider_woman
    aspects: 2
    equal_aspects: true
    text_digest: "d38089696d974656b8e2bbb13e268662"
    note: >-
      The two chosen aspects must contribute the same number of cards.

  - identity: warlock
    aspects: 4
    # His card requires an equal number from ALL FOUR aspects, so every
    # aspect is legal in his deck. marvelcdb records at most `aspect` and
    # `aspect2`, so a Warlock deck's declared aspects are structurally
    # incomplete and purity cannot be judged against them.
    all_aspects: true
    equal_aspects: true
    max_copies_non_signature: 1
    text_digest: "8db209ec5579d5e04f06a2cd02f1594b"
    note: >-
      The card also caps non-signature copies at 1, which overrides
      deck_limit downward for every off-set card.

  - identity: cable
    off_aspect_allowance:
      type_code: player_side_scheme
      limit: null                    # null means no cap
    text_digest: "9e4e17b73bb7254310e5a67ae55caa26"

  - identity: cyclops
    off_aspect_allowance:
      type_code: ally
      trait: X-MEN
      limit: null
    text_digest: "8d0835757085ade4c80c042e56982aeb"

  - identity: wonder_man
    off_aspect_allowance:
      type_code: event
      resource: energy
      limit: null
    text_digest: "07da2db9396ab624c0883a1b8f50c5aa"

  - identity: gam
    off_aspect_allowance:
      type_code: event
      traits_any: ["attack", "thwart"]
      limit: 6
    text_digest: "d916c57313692b93bbab678b10c62b93"
    note: >-
      Off-aspect events are capped at six, counting attacks and thwarts
      together. The cap is on the total, not per trait.

  - identity: maria_hill
    off_aspect_allowance:
      type_code: support
      trait: S.H.I.E.L.D.
      limit: 3
      limit_unit: distinct_titles
    text_digest: "15b0055db56dcbab3756af5007e7cd9d"
    note: >-
      Three S.H.I.E.L.D. supports at their full copy count - the cap is on
      distinct titles, not on cards, so it is 3 titles x deck_limit each.
